name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # to attach the zip to a GitHub Release on version tags

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build the NAM library (AVX2 and SSE2 variants)
        shell: cmd
        run: native\namcore\build.bat

      - name: Build Poly Amp (self-contained)
        run: dotnet publish native\Lad.csproj -c Release -p:Platform=x64 -o dist --nologo

      - name: Self-test (engine, ASIO formats, buffer sizes, NAM models)
        shell: pwsh
        run: |
          Start-Process -FilePath .\dist\PolyAmp.exe -ArgumentList '--dsptest', 'dsptest.txt' -Wait -NoNewWindow
          Get-Content dsptest.txt
          if (-not (Select-String -Path dsptest.txt -Pattern 'RESULT: OK' -Quiet)) { exit 1 }

      - uses: actions/upload-artifact@v4
        with:
          name: PolyAmp-win-x64
          path: dist

      - name: Zip for the release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: Compress-Archive -Path dist\* -DestinationPath PolyAmp-win-x64.zip

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: PolyAmp-win-x64.zip
          generate_release_notes: true
